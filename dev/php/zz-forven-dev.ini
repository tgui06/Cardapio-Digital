; Ajustes do PHP do Herd para rodar o Forven ERP localmente (carregado via PHP_INI_SCAN_DIR).
; O Herd foi desinstalado, mas o php.ini dele ainda referencia arquivos que não existem mais.
auto_prepend_file =
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_startup_errors = Off
memory_limit = 1G
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 120
